name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The app is WPF, so everything builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build RemoteDeck.slnx --configuration Release

      - name: Test
        run: dotnet test RemoteDeck.slnx --configuration Release --no-build
