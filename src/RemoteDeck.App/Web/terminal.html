<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RemoteDeck terminals</title>
<link rel="stylesheet" href="xterm.css">
<style>
  :root { --bg: #2e3440; --panel: #3b4252; --alt: #434c5e; --line: #4c566a; --text: #eceff4; --dim: #8f9bb3;
          --accent: #88c0d0; --danger: #bf616a; --warning: #ebcb8b; --success: #a3be8c; --broadcast: #d08770;
          --radius: 8px; --bw: 1px; --hdr: 24px; --body-top: 4px; --body-left: 8px; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
               font: 12px "Segoe UI", system-ui, sans-serif; }
  #root { position: absolute; inset: 0; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: var(--dim); font-size: 15px; pointer-events: none; }
  #empty.hidden { display: none; }

  .tab { position: absolute; inset: 0; display: none; }
  .tab.active { display: flex; }

  .split { display: flex; min-width: 0; min-height: 0; overflow: hidden; }
  .split.columns { flex-direction: row; }
  .split.rows { flex-direction: column; }
  .gutter { flex: 0 0 6px; background: transparent; }
  .split.columns > .gutter { cursor: col-resize; }
  .split.rows > .gutter { cursor: row-resize; }
  .gutter:hover, .gutter.drag { background: var(--accent); }

  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
          position: relative; background: var(--bg); box-sizing: border-box;
          border: var(--bw) solid var(--line); border-radius: var(--radius); }
  .pane.focused { border-color: var(--accent); }
  .pane.live::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--broadcast);
                      border-radius: var(--radius); pointer-events: none; z-index: 5; }
  .hdr { flex: 0 0 var(--hdr); display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px;
         background: var(--panel); border-bottom: 2px solid transparent; user-select: none; }
  .pane.focused .hdr { border-bottom-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; margin-right: 6px; flex: none; }
  .dot.Connected { background: var(--success); }
  .dot.Connecting { background: var(--warning); }
  .dot.Failed { background: var(--danger); }
  .dot.Disconnected { background: var(--dim); }
  .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spacer { flex: 1; }
  .hdr button { display: flex; align-items: center; background: none; border: 0; color: var(--dim);
                padding: 4px; border-radius: calc(var(--radius) * 0.4); cursor: pointer; }
  .hdr button:hover { color: var(--text); background: var(--alt); }
  .hdr { cursor: grab; }
  .hdr button { cursor: pointer; }
  /* Dragging a pane by its header onto another pane swaps the two. */
  .pane.dragging { opacity: .55; }
  .pane.dropTarget { outline: 2px dashed var(--accent); outline-offset: -3px; }
  .pane.empty [data-a="member"] { display: none; }
  .pane.member [data-a="member"] { color: var(--warning); }
  .pane.live [data-a="member"] { color: var(--broadcast); }

  .body { position: relative; flex: 1 1 0; min-height: 0; }
  .xt { position: absolute; inset: 0; padding: var(--body-top) 0 0 var(--body-left); box-sizing: border-box; }
  .placeholder { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
                 text-align: center; color: var(--dim); line-height: 1.7; pointer-events: none; }
  .pane.empty .placeholder { display: flex; }
  .pane.empty .xt { visibility: hidden; }
  /* A web page in a pane is a native browser the host lays over this area; the page only reserves the space. */
  .pane.web { border-radius: 0; }
  .pane.web .xt { visibility: hidden; }
  .pane.web [data-a="find"], .pane.web [data-a="member"] { display: none; }
  .pane:not(.web) [data-w] { display: none; }
  .pane.ed [data-w] { display: none; }
  .hdr button[data-w] { padding: 4px 7px; font-size: 13px; line-height: 12px; }
  .hdr button:disabled { opacity: .35; cursor: default; background: none; color: var(--dim); }

  .find { position: absolute; top: 6px; right: 14px; z-index: 6; display: none; align-items: center; gap: 2px;
          padding: 3px; background: var(--panel); border: var(--bw) solid var(--line);
          border-radius: calc(var(--radius) * 0.6); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .pane.finding .find { display: flex; }
  .find input { width: 150px; background: var(--bg); color: var(--text); border: var(--bw) solid var(--line);
                border-radius: calc(var(--radius) * 0.4); padding: 3px 6px; font: inherit; outline: none; }
  .find input:focus { border-color: var(--accent); }
  .find input.nomatch { border-color: var(--danger); }
  .find button { background: none; border: 0; color: var(--dim); padding: 3px 5px; cursor: pointer;
                 border-radius: calc(var(--radius) * 0.4); font: inherit; }
  .find button:hover { color: var(--text); background: var(--alt); }
  .find button.on { color: var(--accent); }
  .find .count { color: var(--dim); min-width: 52px; text-align: center; font-size: 11px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="empty">Double-click a saved connection, or use Quick connect.</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-search.js"></script>
<script>
(() => {
  "use strict";

  // The host (WPF) owns tabs, layouts, sessions and the network. This page draws the panes and terminals and
  // forwards keystrokes. Every pane is identified by the id of its terminal.
  //
  // Host -> page:
  //   { t: "sync", tab, tree, panes: [{ id, title, state, empty, web, member }], broadcast }   (idempotent)
  //   { t: "show", tab } | { t: "closeTab", tab } | { t: "out", id, b64 } | { t: "focusPane", id }
  // Page -> host:
  //   { t: "ready" } | { t: "in", id, b64 } | { t: "paste", id, text } | { t: "size", id, cols, rows }
  //   { t: "focus", id } | { t: "ratio", tab, path, ratio } | { t: "action", id, a }
  //   { t: "rects", tab, rects: [{ id, x, y, w, h }] }   where each pane's body is, so the host can lay a browser over it
  const GUTTER = 5;
  // Replaced by the host's "theme" message as soon as the page is ready; these are only the first-paint defaults.
  let termTheme = {
    background: "#2e3440", foreground: "#d8dee9", cursor: "#d8dee9", cursorAccent: "#2e3440",
    selectionBackground: "#434c5e",
    black: "#3b4252", red: "#bf616a", green: "#a3be8c", yellow: "#ebcb8b",
    blue: "#81a1c1", magenta: "#b48ead", cyan: "#88c0d0", white: "#e5e9f0",
    brightBlack: "#4c566a", brightRed: "#bf616a", brightGreen: "#a3be8c", brightYellow: "#ebcb8b",
    brightBlue: "#81a1c1", brightMagenta: "#b48ead", brightCyan: "#8fbcbb", brightWhite: "#eceff4"
  };
  let termFont = { family: '"Cascadia Mono", Consolas, "Courier New", monospace', size: 14 };
  const ICON = {
    cast: '<svg viewBox="0 0 12 12" width="12" height="12"><circle cx="6" cy="6" r="1.6" fill="currentColor"/><path d="M3.3 3.3a3.8 3.8 0 0 0 0 5.4M8.7 3.3a3.8 3.8 0 0 1 0 5.4" stroke="currentColor" fill="none"/></svg>',
    right: '<svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="1.5" width="10" height="9" rx="1.5" fill="none" stroke="currentColor"/><line x1="6" y1="1.5" x2="6" y2="10.5" stroke="currentColor"/></svg>',
    down: '<svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="1.5" width="10" height="9" rx="1.5" fill="none" stroke="currentColor"/><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor"/></svg>',
    find: '<svg viewBox="0 0 12 12" width="12" height="12"><circle cx="5" cy="5" r="3.2" fill="none" stroke="currentColor"/><line x1="7.5" y1="7.5" x2="10.5" y2="10.5" stroke="currentColor"/></svg>',
    up: '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 7.5L6 4l3.5 3.5" stroke="currentColor" fill="none"/></svg>',
    downArrow: '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" fill="none"/></svg>',
    close: '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" fill="none"/></svg>'
  };

  let scrollbackLines = 10000;

  const root = document.getElementById("root");
  const emptyHint = document.getElementById("empty");
  const encoder = new TextEncoder();
  const tabs = new Map();   // tab id -> { el, key, ids: Set, focused }
  const panes = new Map();  // terminal id -> pane record
  let activeTab = null;
  let dragFrom = null;      // the pane being dragged by its header, if any

  function clearDropMarks() {
    for (const p of panes.values()) p.el.classList.remove("dragging", "dropTarget");
  }

  const post = (message) => window.chrome.webview.postMessage(message);

  function toBase64(bytes) {
    let text = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      text += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(text);
  }

  function fromBase64(text) {
    const binary = atob(text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  const observer = new ResizeObserver((entries) => {
    for (const entry of entries) {
      const id = entry.target.dataset.id;
      if (id) refit(id);
    }
    scheduleRects();
  });

  // Tells the host where every visible pane's body is (in page pixels, which are the window's device-independent
  // pixels). Panes that hold a web page are drawn by the host on top of that space.
  let rectsQueued = false;
  let lastRects = null;
  function scheduleRects() {
    if (rectsQueued) return;
    rectsQueued = true;
    requestAnimationFrame(() => {
      rectsQueued = false;
      const tab = tabs.get(activeTab);
      if (!tab) return;
      const rects = [];
      for (const id of tab.ids) {
        const pane = panes.get(id);
        if (!pane || pane.el.offsetParent === null) continue;
        const r = pane.body.getBoundingClientRect();
        rects.push({ id, x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) });
      }
      const message = { t: "rects", tab: activeTab, rects };
      const text = JSON.stringify(message);
      if (text === lastRects) return;
      lastRects = text;
      post(message);
    });
  }
  window.addEventListener("resize", scheduleRects);

  // ---- panes ----

  function createPane(tabId, id) {
    const el = document.createElement("div");
    el.className = "pane empty";
    el.innerHTML =
      '<div class="hdr"><span class="dot"></span><span class="title"></span><span class="spacer"></span>' +
      '<button data-a="webBack" data-w title="Back">&#x2039;</button>' +
      '<button data-a="webForward" data-w title="Forward">&#x203A;</button>' +
      '<button data-a="webReload" data-w title="Reload">&#x21BB;</button>' +
      '<button data-a="webExternal" data-w title="Open in your browser">&#x2197;</button>' +
      '<button data-a="find" title="Find in scrollback (Ctrl+Shift+S)">' + ICON.find + '</button>' +
      '<button data-a="member" title="Include in broadcast group">' + ICON.cast + '</button>' +
      '<button data-a="splitRight" title="Split right">' + ICON.right + '</button>' +
      '<button data-a="splitDown" title="Split down">' + ICON.down + '</button>' +
      '<button data-a="close">' + ICON.close + '</button></div>' +
      '<div class="body"><div class="xt"></div>' +
      '<div class="find"><input type="text" placeholder="Find" spellcheck="false">' +
      '<span class="count"></span>' +
      '<button data-f="case" title="Match case">Aa</button>' +
      '<button data-f="prev" title="Previous (Shift+Enter)">' + ICON.up + '</button>' +
      '<button data-f="next" title="Next (Enter)">' + ICON.downArrow + '</button>' +
      '<button data-f="close" title="Close (Esc)">' + ICON.close + '</button></div>' +
      '<div class="placeholder"><div>Empty pane<br>Double-click a saved connection to open it here</div></div></div>';

    const body = el.querySelector(".body");
    body.dataset.id = id;

    const term = new Terminal({
      fontFamily: termFont.family,
      fontSize: termFont.size,
      cursorBlink: true,
      scrollback: scrollbackLines,
      allowProposedApi: true,   // the find bar highlights matches with decorations
      theme: termTheme
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    const search = new SearchAddon.SearchAddon();
    term.loadAddon(search);

    term.onData((data) => post({ t: "in", id, b64: toBase64(encoder.encode(data)) }));
    term.onBinary((data) => {
      const bytes = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) bytes[i] = data.charCodeAt(i) & 0xff;
      post({ t: "in", id, b64: toBase64(bytes) });
    });

    // Ctrl+C copies when text is selected (otherwise it is the usual interrupt), Ctrl+Shift+C always.
    // Ctrl+V pastes: the host decides where it goes, so a paste into a broadcast group can be confirmed first.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== "keydown" || !e.ctrlKey || e.altKey) return true;
      const key = e.key.toLowerCase();
      if (key === "s" && e.shiftKey) {
        e.preventDefault();
        openFind(id);
        return false;
      }
      if (key === "c" && (e.shiftKey || term.hasSelection())) {
        e.preventDefault();
        if (term.hasSelection()) navigator.clipboard.writeText(term.getSelection()).catch(() => {});
        return false;
      }
      if (key === "v") {
        e.preventDefault();
        navigator.clipboard.readText().then((text) => {
          if (!text) return;
          let data = text.replace(/\r?\n/g, "\r");
          if (term.modes.bracketedPasteMode) data = "\x1b[200~" + data + "\x1b[201~";
          post({ t: "paste", id, text: data });
        }).catch(() => {});
        return false;
      }
      return true;
    });

    el.querySelector(".hdr").addEventListener("click", (e) => {
      const button = e.target.closest("button");
      if (!button || button.disabled) return;
      if (button.dataset.a === "find") openFind(id);
      else post({ t: "action", id, a: button.dataset.a });
    });
    // Drag a pane by its header onto another pane to swap them (the page only reports it; the host does the swap).
    const header = el.querySelector(".hdr");
    header.draggable = true;
    header.addEventListener("dragstart", (e) => {
      dragFrom = id;
      e.dataTransfer.setData("text/plain", id);
      e.dataTransfer.effectAllowed = "move";
      el.classList.add("dragging");
    });
    header.addEventListener("dragend", () => { dragFrom = null; clearDropMarks(); });
    el.addEventListener("dragover", (e) => {
      if (!dragFrom || dragFrom === id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      el.classList.add("dropTarget");
    });
    el.addEventListener("dragleave", (e) => {
      if (!el.contains(e.relatedTarget)) el.classList.remove("dropTarget");
    });
    el.addEventListener("drop", (e) => {
      if (!dragFrom || dragFrom === id) return;
      e.preventDefault();
      const from = dragFrom;
      dragFrom = null;
      clearDropMarks();
      post({ t: "swap", from, to: id });
    });
    wireFind(id, el, term, search);
    el.addEventListener("mousedown", () => setFocus(id));
    el.addEventListener("focusin", () => setFocus(id));

    const pane = {
      tabId, id, el, body, term, fit, search,
      find: { input: el.querySelector(".find input"), count: el.querySelector(".find .count"), matchCase: false },
      xt: el.querySelector(".xt"),
      dot: el.querySelector(".dot"),
      title: el.querySelector(".title"),
      closeButton: el.querySelector('[data-a="close"]'),
      backButton: el.querySelector('[data-a="webBack"]'),
      forwardButton: el.querySelector('[data-a="webForward"]'),
      opened: false, wasEmpty: true
    };
    panes.set(id, pane);
    observer.observe(body);
    return pane;
  }

  // ---- find in scrollback ----

  const FIND_COLORS = {
    matchBackground: "#5b6573", matchBorder: "#88c0d0",
    activeMatchBackground: "#d08770", activeMatchBorder: "#ebcb8b",
    matchOverviewRuler: "#88c0d0", activeMatchColorOverviewRuler: "#d08770"
  };

  function runFind(pane, forward, incremental) {
    const query = pane.find.input.value;
    if (!query) {
      pane.search.clearDecorations();
      pane.find.count.textContent = "";
      pane.find.input.classList.remove("nomatch");
      return;
    }
    const options = { caseSensitive: pane.find.matchCase, incremental: !!incremental, decorations: FIND_COLORS };
    const found = forward ? pane.search.findNext(query, options) : pane.search.findPrevious(query, options);
    pane.find.input.classList.toggle("nomatch", !found);
    if (!found) pane.find.count.textContent = "No match";
  }

  function openFind(id) {
    const pane = panes.get(id);
    if (!pane || pane.el.classList.contains("empty")) return;
    pane.el.classList.add("finding");
    const selected = pane.term.hasSelection() ? pane.term.getSelection() : "";
    if (selected && !selected.includes("\n")) pane.find.input.value = selected;
    pane.find.input.focus();
    pane.find.input.select();
    if (pane.find.input.value) runFind(pane, true, true);
  }

  function closeFind(pane) {
    pane.el.classList.remove("finding");
    pane.search.clearDecorations();
    pane.find.count.textContent = "";
    pane.find.input.classList.remove("nomatch");
    pane.term.focus();
  }

  function wireFind(id, el, term, search) {
    const input = el.querySelector(".find input");
    const count = el.querySelector(".find .count");
    // The pane record is created just after this runs, so look it up when it is needed.
    const pane = () => panes.get(id);

    search.onDidChangeResults((r) => {
      if (!r || r.resultCount === undefined) return;
      count.textContent = r.resultCount === 0 ? "No match"
        : (r.resultIndex >= 0 ? (r.resultIndex + 1) + " / " : "") + r.resultCount + (r.resultCount >= 1000 ? "+" : "");
    });

    input.addEventListener("input", () => { const p = pane(); if (p) runFind(p, true, true); });
    input.addEventListener("keydown", (e) => {
      const p = pane();
      if (!p) return;
      if (e.key === "Escape") { e.preventDefault(); closeFind(p); }
      else if (e.key === "Enter") { e.preventDefault(); runFind(p, !e.shiftKey, false); }
      else if (e.key === "F3") { e.preventDefault(); runFind(p, !e.shiftKey, false); }
      e.stopPropagation();
    });
    el.querySelector(".find").addEventListener("click", (e) => {
      const button = e.target.closest("button");
      const p = pane();
      if (!button || !p) return;
      const what = button.dataset.f;
      if (what === "close") closeFind(p);
      else if (what === "next") runFind(p, true, false);
      else if (what === "prev") runFind(p, false, false);
      else if (what === "case") {
        p.find.matchCase = !p.find.matchCase;
        button.classList.toggle("on", p.find.matchCase);
        p.search.clearDecorations();   // forgets the last search, so the changed option is not skipped as "same query"
        runFind(p, true, true);
      }
    });
  }

  function destroyPane(id) {
    const pane = panes.get(id);
    if (!pane) return;
    observer.unobserve(pane.body);
    pane.term.dispose();
    pane.el.remove();
    panes.delete(id);
  }

  function updatePane(meta, broadcast) {
    const pane = panes.get(meta.id);
    if (!pane) return;

    pane.title.textContent = meta.title || "";
    pane.dot.className = "dot " + (meta.empty ? "" : meta.state);
    pane.el.classList.toggle("empty", meta.empty);
    pane.el.classList.toggle("web", !!meta.web);
    pane.el.classList.toggle("ed", !!meta.editor);
    pane.backButton.disabled = !meta.back;
    pane.forwardButton.disabled = !meta.fwd;
    pane.el.classList.toggle("member", meta.member);
    pane.el.classList.toggle("live", broadcast && meta.member);
    pane.closeButton.title = meta.empty ? "Remove this pane" : "End this session";

    if (meta.empty && !pane.wasEmpty) pane.term.reset();
    pane.wasEmpty = meta.empty;
  }

  function openIfNeeded(pane) {
    if (pane.opened || !pane.el.isConnected || pane.el.offsetParent === null) return;
    pane.term.open(pane.xt);
    pane.opened = true;
  }

  function refit(id) {
    const pane = panes.get(id);
    if (!pane) return;
    openIfNeeded(pane);
    if (!pane.opened || pane.el.offsetParent === null) return;
    try { pane.fit.fit(); } catch { return; }
    post({ t: "size", id, cols: pane.term.cols, rows: pane.term.rows });
  }

  function setFocus(id) {
    const pane = panes.get(id);
    const tab = pane && tabs.get(pane.tabId);
    if (!tab || tab.focused === id) return;
    if (tab.focused && panes.has(tab.focused)) panes.get(tab.focused).el.classList.remove("focused");
    tab.focused = id;
    pane.el.classList.add("focused");
    post({ t: "focus", id });
  }

  // ---- layout ----

  function structureKey(node) {
    return node.k === "pane" ? node.id : node.o + "(" + structureKey(node.a) + "," + structureKey(node.b) + ")";
  }

  function build(node, path, tabId) {
    if (node.k === "pane") return panes.get(node.id).el;

    const wrap = document.createElement("div");
    wrap.className = "split " + node.o;
    const first = build(node.a, path.concat(0), tabId);
    const second = build(node.b, path.concat(1), tabId);
    first.style.flex = node.r + " 1 0";
    second.style.flex = (1 - node.r) + " 1 0";

    const gutter = document.createElement("div");
    gutter.className = "gutter";
    wrap.append(first, gutter, second);
    attachDrag(gutter, wrap, first, second, node.o === "columns", path, tabId);
    return wrap;
  }

  function attachDrag(gutter, wrap, first, second, horizontal, path, tabId) {
    gutter.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      gutter.setPointerCapture(e.pointerId);
      gutter.classList.add("drag");
      let ratio = null;

      const move = (ev) => {
        const rect = wrap.getBoundingClientRect();
        const size = (horizontal ? rect.width : rect.height) - GUTTER;
        if (size <= 0) return;
        const pos = (horizontal ? ev.clientX - rect.left : ev.clientY - rect.top) - GUTTER / 2;
        ratio = Math.min(0.95, Math.max(0.05, pos / size));
        first.style.flex = ratio + " 1 0";
        second.style.flex = (1 - ratio) + " 1 0";
        scheduleRects();
      };
      const up = (ev) => {
        gutter.releasePointerCapture(ev.pointerId);
        gutter.classList.remove("drag");
        gutter.removeEventListener("pointermove", move);
        gutter.removeEventListener("pointerup", up);
        if (ratio !== null) post({ t: "ratio", tab: tabId, path, ratio });
      };
      gutter.addEventListener("pointermove", move);
      gutter.addEventListener("pointerup", up);
    });
  }

  function afterLayout(tabId) {
    scheduleRects();
    requestAnimationFrame(() => {
      const tab = tabs.get(tabId);
      if (!tab || tabId !== activeTab) return;
      for (const id of tab.ids) refit(id);
      const target = (tab.focused && panes.get(tab.focused)) || null;
      if (target && target.opened && !target.el.classList.contains("empty")) target.term.focus();
    });
  }

  function applyTheme(m) {
    const style = document.documentElement.style;
    for (const [name, value] of Object.entries(m.ui)) style.setProperty("--" + name, value);
    if (m.shape) {
      const density = { compact: [20, 2, 6], comfortable: [24, 4, 8], spacious: [30, 8, 12] }[m.shape.density] || [24, 4, 8];
      style.setProperty("--radius", m.shape.radius + "px");
      style.setProperty("--bw", m.shape.borderWidth + "px");
      style.setProperty("--hdr", density[0] + "px");
      style.setProperty("--body-top", density[1] + "px");
      style.setProperty("--body-left", density[2] + "px");
    }
    termTheme = m.term;
    termFont = m.font;
    for (const pane of panes.values()) {
      pane.term.options.theme = termTheme;
      pane.term.options.fontFamily = termFont.family;
      pane.term.options.fontSize = termFont.size;
    }
    for (const id of panes.keys()) refit(id);
  }

  function updateEmptyHint() {
    emptyHint.classList.toggle("hidden", tabs.size > 0);
  }

  function sync(m) {
    let tab = tabs.get(m.tab);
    if (!tab) {
      const el = document.createElement("div");
      el.className = "tab";
      root.appendChild(el);
      tab = { el, key: null, ids: new Set(), focused: null };
      tabs.set(m.tab, tab);
      updateEmptyHint();
    }

    const wanted = new Set(m.panes.map((p) => p.id));
    for (const id of tab.ids) {
      if (!wanted.has(id)) {
        destroyPane(id);
        if (tab.focused === id) tab.focused = null;
      }
    }
    for (const meta of m.panes) {
      if (!panes.has(meta.id)) createPane(m.tab, meta.id);
      updatePane(meta, m.broadcast);
    }
    tab.ids = wanted;

    scheduleRects();
    const key = structureKey(m.tree);
    if (key !== tab.key) {
      tab.key = key;
      const top = build(m.tree, [], m.tab);
      top.style.flex = "1 1 0";
      tab.el.replaceChildren(top);
      afterLayout(m.tab);
    }
  }

  function showTab(tabId) {
    activeTab = tabId;
    lastRects = null;   // the host hides its browsers while another tab is up, so it needs the positions again
    for (const [id, tab] of tabs) tab.el.classList.toggle("active", id === tabId);
    afterLayout(tabId);
  }

  function closeTab(tabId) {
    const tab = tabs.get(tabId);
    if (!tab) return;
    for (const id of [...tab.ids]) destroyPane(id);
    tab.el.remove();
    tabs.delete(tabId);
    if (activeTab === tabId) activeTab = null;
    updateEmptyHint();
  }

  window.chrome.webview.addEventListener("message", (event) => {
    const m = event.data;
    switch (m.t) {
      case "theme": applyTheme(m); break;
      case "scrollback":
        scrollbackLines = m.lines;
        for (const pane of panes.values()) pane.term.options.scrollback = m.lines;
        break;
      case "sync": sync(m); break;
      case "show": showTab(m.tab); break;
      case "closeTab": closeTab(m.tab); break;
      case "out": panes.get(m.id)?.term.write(fromBase64(m.b64)); break;
      case "focusPane": panes.get(m.id)?.term.focus(); break;
    }
  });

  // App shortcuts. They are caught before the terminal sees them and handled by the host, which also
  // owns the same list for when the WPF side has focus. Plain Ctrl+letter keys stay with the shell.
  const shortcuts = new Set([
    "ctrl+shift+p", "ctrl+shift+t", "ctrl+shift+w", "ctrl+shift+b", "ctrl+shift+f", "ctrl+shift+l", "ctrl+tab", "ctrl+shift+tab",
  ]);
  document.addEventListener("keydown", (e) => {
    if (!e.ctrlKey || e.altKey || e.metaKey) return;
    // Find is handled here, in the page, so it works wherever focus is inside it.
    if (e.shiftKey && e.key.toLowerCase() === "s") {
      e.preventDefault();
      e.stopPropagation();
      const tab = tabs.get(activeTab);
      if (tab && tab.focused) openFind(tab.focused);
      return;
    }
    const combo = "ctrl+" + (e.shiftKey ? "shift+" : "") + e.key.toLowerCase();
    if (!shortcuts.has(combo)) return;
    e.preventDefault();
    e.stopPropagation();
    post({ t: "key", k: combo });
  }, true);

  // Tells the host the user is here, so the vault does not lock while someone reads or scrolls a terminal.
  let lastActivity = 0;
  for (const type of ["mousemove", "mousedown", "wheel", "keydown"]) {
    document.addEventListener(type, () => {
      const now = Date.now();
      if (now - lastActivity < 5000) return;
      lastActivity = now;
      post({ t: "activity" });
    }, true);
  }

  post({ t: "ready" });
})();
</script>
</body>
</html>
